services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


      - ./backend/helpdesk/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/helpdesk/database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/helpdesk
    ports:
      - "9090:9090"
    environment:
      DB_URL: jdbc:postgresql://db:5432/helpdesk
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: ${JWT_SECRET:-helpdesk-secret-key-2024-muito-longa-para-hmac-sha256-minimo-256bits}
      UPLOAD_DIR: /app/uploads
      FRONT_URL: http://localhost:4200
      CORS_ORIGINS: http://localhost:4200,http://localhost:3000
    volumes:

      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
