server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de anexos chegam até 10 MB (limite validado no backend)
    client_max_body_size 12m;

    # Rotas do Angular são resolvidas no cliente: qualquer caminho cai no index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Repassa as chamadas de API para o backend. Assim o front usa caminho
    # relativo (/api), sem depender do host e sem precisar de CORS.
    location /api/ {
        proxy_pass         http://backend:9090/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome podem ser cacheados agressivamente
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
