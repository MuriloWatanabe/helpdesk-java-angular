# Perfil de produção: SPRING_PROFILES_ACTIVE=prod
# Segredos obrigatórios via variável de ambiente (sem valor padrão): a aplicação não sobe sem eles.
jwt.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
cors.allowed-origins=${CORS_ORIGINS}
app.front-url=${FRONT_URL}

# Link de redefinição nunca é devolvido na API em produção.
app.reset-senha.expor-link=false

# Documentação interativa desligada em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
