# ================================================
# CONFIGURAÇÕES DO SERVIDOR
# ================================================
server.port=8080
server.servlet.context-path=/api
spring.application.name=helpdesk-api

# ================================================
# CONFIGURAÇÕES DO BANCO DE DADOS - PostgreSQL
# ================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=postgres
spring.datasource.password=sua_senha
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ================================================
# CONFIGURAÇÕES JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ================================================
# CONFIGURAÇÕES DE LOGGING
# ================================================
logging.level.root=INFO
logging.level.com.murilo.helpdesk=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ================================================
# CONFIGURAÇÕES DE SEGURANÇA (JWT)
# ================================================
jwt.secret=sua_chave_secreta_super_segura_aqui_com_minimo_32_caracteres
jwt.expiration=86400000

# ================================================
# CONFIGURAÇÕES DE CORS
# ================================================
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# ================================================
# CONFIGURAÇÕES ADICIONAIS
# ================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk
spring.datasource.username=postgres
spring.datasource.password=senha

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true