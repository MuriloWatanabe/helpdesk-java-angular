# ================================================
# SERVIDOR
# ================================================
server.port=9090
server.servlet.context-path=/api
spring.application.name=helpdesk-api

# ================================================
# BANCO DE DADOS - PostgreSQL
# ================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/helpdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ================================================
# JPA / HIBERNATE
# O schema é criado pelos scripts em database/ (ver README).
# ================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ================================================
# SEGURANÇA / JWT
# Em produção defina JWT_SECRET: o valor padrão abaixo é público
# (está versionado) e serve apenas para desenvolvimento local.
# ================================================
jwt.secret=${JWT_SECRET:helpdesk-secret-key-2024-muito-longa-para-hmac-sha256-minimo-256bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================================
# APLICAÇÃO
# ================================================
# Diretório onde os anexos dos chamados são gravados
app.upload-dir=${UPLOAD_DIR:uploads}
# URL do front, usada para montar o link de redefinição de senha
app.front-url=${FRONT_URL:http://localhost:4200}
# Sem servidor de e-mail configurado, o link de redefinição volta na resposta.
# Desligue em produção (RESET_EXPOR_LINK=false) assim que houver envio de e-mail.
app.reset-senha.expor-link=${RESET_EXPOR_LINK:true}

# ================================================
# UPLOAD DE ARQUIVOS
# ================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ================================================
# CORS
# ================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# ================================================
# SERIALIZAÇÃO
# ================================================
spring.jackson.time-zone=America/Sao_Paulo

# ================================================
# LOGGING
# ================================================
logging.level.root=INFO
logging.level.com.murilo.helpdesk=INFO
logging.level.org.springframework.web=WARN
# DEBUG aqui despeja detalhes de autenticação a cada requisição — só ligue ao investigar login.
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
