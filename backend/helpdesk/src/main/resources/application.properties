# ================================================
# SERVIDOR
# ================================================
server.port=8080
server.servlet.context-path=/api
spring.application.name=helpdesk-api

# ================================================
# BANCO DE DADOS - PostgreSQL
# ================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ================================================
# SEGURANÇA / JWT
# ================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ================================================
# CORS
# ================================================
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# ================================================
# SERIALIZAÇÃO
# ================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ================================================
# LOGGING
# ================================================
logging.level.root=INFO
logging.level.com.murilo.helpdesk=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
